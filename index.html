<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zav Premium Hosting - Client & Admin Login</title>
    <style>
        :root {
            --bg: #060b10;
            --surface: #0d1520;
            --border: #182639;
            --text: #c3cddb;
            --text-dim: #5e708b;
            --accent: #e8601c;
            --accent-hover: #f4783b;
            --input-bg: #080e16;
            --error: #d9443a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
        }
        .login-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 45px 38px;
        }
        .logo {
            text-align: center;
            font-size: 2em;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 4px;
        }
        .logo span { color: var(--accent); }
        .subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.85em;
            margin-bottom: 32px;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.75em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 13px 15px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            font-size: 0.95em;
            transition: border 0.2s;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 0.95em;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-login:hover { background: var(--accent-hover); }
        .error-msg {
            background: #1a0f0f;
            border: 1px solid #3d1f1f;
            color: var(--error);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.85em;
            margin-bottom: 18px;
            display: none;
            text-align: center;
        }
        .divider {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.75em;
            margin: 20px 0;
            position: relative;
            letter-spacing: 1px;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background: var(--border);
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .register-link {
            text-align: center;
            font-size: 0.85em;
            color: var(--text-dim);
        }
        .register-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .register-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo">ZAV<span>HOSTING</span></div>
            <p class="subtitle">Client &amp; Administrator Access</p>

            <div class="error-msg" id="errorMsg">Invalid credentials. Please try again.</div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-login">Sign In</button>
            </form>

            <div class="divider">OR</div>
            <div class="register-link">
                New client? <a href="#" onclick="showRegisterInfo(event)">Request an account</a>
            </div>
        </div>
    </div>

    <script>
        // ============ DEFAULT ACCOUNTS (stored in localStorage) ============
        function initAccounts() {
            if (!localStorage.getItem('vza_accounts')) {
                const defaultAccounts = [
                    {
                        id: 1,
                        username: 'admin',
                        password: 'admin123',
                        role: 'admin',
                        credits: 0,
                        status: 'approved',
                        createdAt: new Date().toISOString()
                    },
                    {
                        id: 2,
                        username: 'clientdemo',
                        password: 'client123',
                        role: 'client',
                        credits: 500,
                        status: 'approved',
                        createdAt: new Date().toISOString()
                    },
                    {
                        id: 3,
                        username: 'pendinguser',
                        password: 'pending123',
                        role: 'client',
                        credits: 0,
                        status: 'pending',
                        createdAt: new Date().toISOString()
                    }
                ];
                localStorage.setItem('vza_accounts', JSON.stringify(defaultAccounts));
            }
            if (!localStorage.getItem('vza_requests')) {
                localStorage.setItem('vza_requests', JSON.stringify([]));
            }
        }
        initAccounts();

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            const accounts = JSON.parse(localStorage.getItem('vza_accounts'));
            const user = accounts.find(a => a.username === username && a.password === password);

            if (!user) {
                errorMsg.textContent = 'Invalid username or password.';
                errorMsg.style.display = 'block';
                return;
            }

            if (user.status === 'pending') {
                errorMsg.textContent = 'Your account is pending admin approval. Please wait.';
                errorMsg.style.display = 'block';
                return;
            }

            if (user.status === 'rejected') {
                errorMsg.textContent = 'Your account request was rejected. Contact admin.';
                errorMsg.style.display = 'block';
                return;
            }

            // Store session
            sessionStorage.setItem('vza_currentUser', JSON.stringify(user));

            // Redirect based on role
            if (user.role === 'admin') {
                window.location.href = 'admin/dashboard.html';
            } else {
                window.location.href = 'client/dashboard.html';
            }
        }

        function showRegisterInfo(e) {
            e.preventDefault();
            alert('To request an account, contact the administrator.\n\nTelegram: @ZavCloudZv\n\nProvide your desired username and the admin will create and approve your account.');
        }
    </script>

</body>
</html>
